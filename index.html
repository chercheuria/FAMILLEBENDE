const fmt = n => (Number(n)||0).toLocaleString('fr-FR',{maximumFractionDigits:0}) + " FCFA";
const esc = s => (s==null?"":String(s)).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = s => { if(!s) return ""; const d=new Date(s+"T00:00:00"); if(isNaN(d)) return s; return d.toLocaleDateString('fr-FR',{day:"2-digit",month:"long",year:"numeric"}); };
function computeAge(dateNaissance, dateDeces){
  if(!dateNaissance) return null;
  const start = new Date(dateNaissance+"T00:00:00");
  if(isNaN(start)) return null;
  const end = dateDeces ? new Date(dateDeces+"T00:00:00") : new Date();
  if(isNaN(end) || end < start) return null;
  let age = end.getFullYear() - start.getFullYear();
  const m = end.getMonth() - start.getMonth();
  if(m < 0 || (m===0 && end.getDate() < start.getDate())) age--;
  return age;
}
function ageLabel(dateNaissance, dateDeces){
  const age = computeAge(dateNaissance, dateDeces);
  if(age==null) return "";
  return `${age} an${age>1?"s":""}${dateDeces?" (au décès)":""}`;
}

function handlePhotoUpload(fieldId){
  const fileInput = document.getElementById(fieldId+"-file");
  const file = fileInput && fileInput.files && fileInput.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    const img = new Image();
    img.onload = ()=>{
      const size=220;
      const canvas=document.createElement("canvas");
      canvas.width=size; canvas.height=size;
      const ctx=canvas.getContext("2d");
      const scale=Math.max(size/img.width, size/img.height);
      const w=img.width*scale, h=img.height*scale;
      ctx.drawImage(img,(size-w)/2,(size-h)/2,w,h);
      const dataUrl=canvas.toDataURL("image/jpeg",0.82);
      const hidden=document.getElementById(fieldId);
      const preview=document.getElementById(fieldId+"-preview");
      if(hidden) hidden.value=dataUrl;
      if(preview) preview.src=dataUrl;
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}
function clearPhoto(fieldId){
  const hidden=document.getElementById(fieldId);
  const preview=document.getElementById(fieldId+"-preview");
  if(hidden) hidden.value="";
  if(preview) preview.src=BLANK_AVATAR;
}

function monthsSince2025(){
  const now = new Date(); const arr=[];
  for(let y=2025;y<=now.getFullYear();y++){
    const maxM = y===now.getFullYear() ? now.getMonth() : 11;
    for(let m=0;m<=maxM;m++) arr.push({year:y,month:m});
  }
  return arr;
}

function cotisantsCount(familyId){ return state.members.filter(m=>m.familyId===familyId && m.status!=='decede' && !m.honneur).length; }
function telLink(number, size=12){
  if(!number) return "";

  return `<a href="tel:${clean}" onclick="event.stopPropagation()" title="Appeler ${esc(number)}" class="inline-flex items-center justify-center w-6 h-6 rounded-full text-[#ea580c] bg-[#fff7ed] hover:bg-[#ffedd5] shrink-0">${icon("phone",size)}</a>`;
}
function memberCount(familyId){ return state.members.filter(m=>m.familyId===familyId).length; }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function getContribution(ev, familyId){
  const fam = state.families.find(f=>f.id===familyId);
  const c = (ev && ev.contributions && ev.contributions[familyId]) || {};
  return {
    montantPrevu: c.montantPrevu!=null ? Number(c.montantPrevu) : (fam ? Number(fam.montantDeces)||0 : 0),
    montantPaye: Number(c.montantPaye)||0,
    date: c.date || ""
  };
}
function contribStatus(c){
  const paid = c.montantPrevu>0 && c.montantPaye>=c.montantPrevu;
  const partial = !paid && c.montantPaye>0;
  return { paid, partial, tone: paid?"good":(partial?"warn":"bad"), label: paid?"✓ Réglé":(partial?"Partiel":"Non réglé") };
}

/* ------- persistance ------- */

async function loadData(){
  try{
    const res = await window.storage.get("bende-data", true);
    if(res && res.value){
      state = JSON.parse(res.value);
      if(!state.genealogie) state.genealogie = structuredClone(defaultData.genealogie);
      if(!state.honneurPayments) state.honneurPayments = [];
      if(!state.bankPin) state.bankPin = "1234";
      if(!state.caissePin) state.caissePin = "1234";
      if(!state.cotisationPin) state.cotisationPin = "1234";
      if(!state.pinLocks) state.pinLocks = { banque:{attempts:0,lockedUntil:null}, caisse:{attempts:0,lockedUntil:null}, cotisation:{attempts:0,lockedUntil:null} };
      return;
    }
  }catch(e){ /* pas encore de données */ }
  state = structuredClone(defaultData);
  try{ await window.storage.set("bende-data", JSON.stringify(state), true); }catch(e){}
}

function scheduleSave(){
  saveIndicator = "saving";
  updateSaveIndicator();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{ await window.storage.set("bende-data", JSON.stringify(state), true); saveIndicator="saved"; }
    catch(e){ saveIndicator="idle"; }
    updateSaveIndicator();
  }, 400);
}
function updateSaveIndicator(){
  const el = document.getElementById("save-indicator");
  if(!el) return;
  el.innerHTML = saveIndicator==="saving"
    ? `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="spin"><circle cx="12" cy="12" r="10" stroke-opacity="0.3"/><path d="M12 2a10 10 0 0 1 10 10"/></svg> Enregistrement…`
    : `${icon("shield",12)} Données partagées, synchronisées`;
}

function mutate(fn){
  fn(state);
  scheduleSave();
  renderTab();
}

function renderDashboard(){
  const months = monthsSince2025();
  const currentYear = new Date().getFullYear();
  const totalMembers = state.members.length;
  const totalActive = state.members.filter(m=>m.status!=='decede').length;
  const soldeBanque = sumTx(state.bankTransactions);
  const soldeCaisse = sumTx(state.caisseTransactions);

  const chartData = MONTH_NAMES.map((lbl,mIdx)=>{
    if(!months.find(mo=>mo.year===currentYear && mo.month===mIdx)) return {mois:lbl.slice(0,3), du:0, percu:0};
    let du=0; state.families.forEach(f=>{ du += cotisantsCount(f.id) * state.tariffMensuel; });
    const percu = state.monthlyPayments.filter(p=>p.year===currentYear && p.month===mIdx).reduce((s,p)=>s+Number(p.amount),0);
    return {mois:lbl.slice(0,3), du, percu};
  });
  const totalDuAnnee = chartData.reduce((s,c)=>s+c.du,0);
  const totalPercuAnnee = chartData.reduce((s,c)=>s+c.percu,0);
  const maxVal = Math.max(1, ...chartData.map(c=>Math.max(c.du,c.percu)));

  const decesEnCours = state.deathEvents.filter(ev=>{
    return state.families.some(f=>!contribStatus(getContribution(ev,f.id)).paid);
  });

  const barsHtml = chartData.map(c=>{
    const hDu = Math.round((c.du/maxVal)*140);
    const hPercu = Math.round((c.percu/maxVal)*140);
    return `<div class="flex flex-col items-center gap-1 flex-1 min-w-[28px]">
      <div class="flex items-end gap-0.5 h-[140px]">
        <div class="w-3 sm:w-4 rounded-t bg-[#fed7aa]" style="height:${hDu}px" title="Dû : ${fmt(c.du)}"></div>
        <div class="w-3 sm:w-4 rounded-t bg-[#ea580c]" style="height:${hPercu}px" title="Perçu : ${fmt(c.percu)}"></div>
      </div>
      <span class="text-[10px] text-[#6b7280]">${c.mois}</span>
    </div>`;
  }).join("");

  return `
    ${sectionTitle("Tableau de bord","Vue d'ensemble de l'association familiale")}
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
      ${statCard("users","Familles", state.families.length, "#f97316", `${totalMembers} membres, dont ${totalActive} actifs`)}
      ${statCard("wallet","Solde caisse", fmt(soldeCaisse), "#22c55e")}
      ${statCard("landmark","Solde banque", fmt(soldeBanque), "#2563eb")}
      ${statCard("heart","Décès en cours", decesEnCours.length, "#dc2626", decesEnCours.length? "cotisation(s) non soldée(s)":"aucune en attente")}
    </div>

    ${card(`
      <div class="p-5">
        <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
          <div>
            <h3 class="font-semibold text-[#1f2937] font-display">Cotisation mensuelle ${currentYear}</h3>
            <p class="text-xs text-[#6b7280] mt-0.5">Dû ${fmt(totalDuAnnee)} · Perçu ${fmt(totalPercuAnnee)} · Reste ${fmt(Math.max(totalDuAnnee-totalPercuAnnee,0))}</p>
          </div>
          <div class="flex items-center gap-3 text-xs text-[#4b5563]">
            <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-sm bg-[#fed7aa] inline-block"></span> Dû</span>
            <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-sm bg-[#ea580c] inline-block"></span> Perçu</span>
          </div>
        </div>
        <div class="flex items-end gap-1 sm:gap-2 overflow-x-auto pb-1">${barsHtml}</div>
      </div>
    `, "mb-6")}

    ${card(`
      <div class="p-5">
        <h3 class="font-semibold text-[#1f2937] mb-3 font-display">Répartition par branche familiale</h3>
        <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
          ${state.families.map(f=>`
            <div class="border border-[#ffedd5] rounded-xl p-3.5">
              <p class="font-medium text-[#1f2937] text-sm">${esc(f.name)}</p>
              <p class="text-xs text-[#6b7280] mt-0.5">${activeCount(f.id)} membre(s) actif(s)</p>
              <p class="text-xs text-[#9ca3af] mt-1">Cotisation décès fixée : ${fmt(f.montantDeces)}</p>
            </div>`).join("")}
        </div>
      </div>
    `)}
  `;
}

function deleteFamily(id){
  if(memberCount(id)>0){
    if(!confirm("Cette famille contient des membres. Les supprimer aussi et retirer la famille ?")) return;

  mutate(d=>{ d.families=d.families.filter(f=>f.id!==id); d.members=d.members.filter(m=>m.familyId!==id); });
}

function genPersonByPath(path){
  if(path==="pere") return state.genealogie.pere;
  if(path==="mere") return state.genealogie.mere;
  const parts = path.split(":");
  if(parts[0]==="enfant") return state.genealogie.enfants.find(e=>e.id===parts[1]);
  if(parts[0]==="petitenfant"){
    const parent = state.genealogie.enfants.find(e=>e.id===parts[1]);
    return parent && parent.enfants ? parent.enfants.find(c=>c.id===parts[2]) : null;
  }
  return null;
}

/* ---- Export PDF du point des paiements ---- */
function exportCotisationPdf(){
  if(!window.jspdf || !window.jspdf.jsPDF){ alert("Le module PDF n'a pas pu se charger. Vérifiez la connexion internet."); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const periode = `${MONTH_NAMES[cotisationSel.month]} ${cotisationSel.year}`;

  doc.setFontSize(14);
  doc.text("Famille BENDE — Point des paiements", 14, 16);
  doc.setFontSize(10);
  doc.setTextColor(100);
  doc.text(`Cotisation mensuelle — ${periode}`, 14, 23);
  doc.setTextColor(0);

  const famRows = state.families.map(f=>{
    const nb = cotisantsCount(f.id);
    const due = nb * state.tariffMensuel;
    const paid = state.monthlyPayments.filter(p=>p.familyId===f.id && p.year===cotisationSel.year && p.month===cotisationSel.month).reduce((s,p)=>s+Number(p.amount),0);
    const reste = Math.max(due-paid,0);
    const label_ = (paid>=due && due>0) ? "Payé" : (paid>0 ? "Partiel" : "Impayé");
    return [f.name, String(nb), fmt(due), fmt(paid), fmt(reste), label_];
  });
  doc.autoTable({
    startY: 28,
    head: [["Famille","Cotisants","Dû","Perçu","Reste","Statut"]],
    body: famRows,
    styles: { fontSize: 9 },
    headStyles: { fillColor: [234,88,12] }
  });

  let nextY = (doc.lastAutoTable && doc.lastAutoTable.finalY ? doc.lastAutoTable.finalY : 28) + 10;

  if(cotisationMode==="membre"){
    const memRows = cotisationMembres().map(m=>{
      const due = Number(state.tariffMensuel)||0;
      const paid = state.monthlyPayments.filter(p=>p.memberId===m.id && p.year===cotisationSel.year && p.month===cotisationSel.month).reduce((s,p)=>s+Number(p.amount),0);
      const reste = Math.max(due-paid,0);
      const label_ = (paid>=due && due>0) ? "Payé" : (paid>0 ? "Partiel" : "Impayé");
      return [String(m.numero||""), m.name, famName(m.familyId), fmt(due), fmt(paid), fmt(reste), label_];
    });
    doc.setFontSize(11);
    doc.text("Détail par membre", 14, nextY);
    doc.autoTable({
      startY: nextY + 4,
      head: [["N°","Membre","Famille","Dû","Payé","Reste","Statut"]],
      body: memRows,
      styles: { fontSize: 8 },
      headStyles: { fillColor: [234,88,12] }
    });
  }

  doc.save(`cotisation_${MONTH_NAMES[cotisationSel.month]}_${cotisationSel.year}.pdf`);
}

const PIN_CONFIG = {
  banque: { pinKey:"bankPin", label:"Banque", iconName:"landmark", accent:"#2563eb" },
  caisse: { pinKey:"caissePin", label:"Caisse", iconName:"wallet", accent:"#22c55e" },
  cotisation: { pinKey:"cotisationPin", label:"Cotisation mensuelle", iconName:"calendar", accent:"#f97316" }
};
const PIN_MAX_ATTEMPTS = 5;
const PIN_LOCK_DURATION_MS = 10*60*1000; // 10 minutes

function getPinLock(tabKey){
  if(!state.pinLocks) state.pinLocks = {};
  if(!state.pinLocks[tabKey]) state.pinLocks[tabKey] = { attempts:0, lockedUntil:null };
  return state.pinLocks[tabKey];
}
function isTabLocked(tabKey){
  const l = getPinLock(tabKey);
  if(l.lockedUntil && Date.now() >= l.lockedUntil){ l.attempts = 0; l.lockedUntil = null; }
  return !!(l.lockedUntil && Date.now() < l.lockedUntil);
}
function remainingLockMs(tabKey){
  const l = getPinLock(tabKey);
  return l.lockedUntil ? Math.max(0, l.lockedUntil - Date.now()) : 0;
}
function formatDuration(ms){
  const totalSec = Math.max(0, Math.ceil(ms/1000));
  const m = Math.floor(totalSec/60), s = totalSec%60;
  return `${m} min ${String(s).padStart(2,"0")} s`;
}

function renderPinGate(tabKey){
  const cfg = PIN_CONFIG[tabKey];
  if(pinLockTimers[tabKey]){ clearTimeout(pinLockTimers[tabKey]); pinLockTimers[tabKey]=null; }

  if(isTabLocked(tabKey)){
    const ms = remainingLockMs(tabKey);
    pinLockTimers[tabKey] = setTimeout(()=>{ if(currentTab===tabKey) renderTab(); }, Math.min(ms+300, 2147483647));
    return `
      <div class="max-w-sm mx-auto mt-8 sm:mt-14">
        ${card(`
          <div class="p-6 text-center">
            <div class="w-14 h-14 mx-auto rounded-full flex items-center justify-center mb-3" style="background:#dc26261f;color:#dc2626">${icon("alert",26)}</div>
            <h3 class="font-semibold text-[#1f2937] font-display text-lg mb-1">Accès bloqué</h3>
            <p class="text-sm text-[#6b7280] mb-1">Trop de tentatives incorrectes pour « ${cfg.label} ».</p>
            <p class="text-sm text-[#dc2626] font-medium mb-1">Réessayez dans ${formatDuration(ms)}</p>
            <p class="text-xs text-[#9ca3af]">L'accès se débloque automatiquement une fois le délai écoulé.</p>
          </div>
        `)}
      </div>`;
  }

  const attempts = getPinLock(tabKey).attempts;
  const remaining = PIN_MAX_ATTEMPTS - attempts;
  return `
    <div class="max-w-sm mx-auto mt-8 sm:mt-14">
      ${card(`
        <div class="p-6 text-center">
          <div class="w-14 h-14 mx-auto rounded-full flex items-center justify-center mb-3" style="background:${cfg.accent}1f;color:${cfg.accent}">${icon(cfg.iconName,26)}</div>
          <h3 class="font-semibold text-[#1f2937] font-display text-lg mb-1">Accès protégé</h3>
          <p class="text-sm text-[#6b7280] mb-4">Entrez le code PIN pour accéder à « ${cfg.label} »</p>
          <input id="pin-input-${tabKey}" type="password" inputmode="numeric" maxlength="8" placeholder="••••" autofocus
            class="w-full text-center tracking-[8px] text-lg px-3 py-2.5 rounded-lg border border-[#e5e7eb] bg-white focus:outline-none focus:ring-2 focus:ring-[#fbbf24] mb-2"
            onkeydown="if(event.key==='Enter') App.tryUnlockTab('${tabKey}')" />
          <p id="pin-error-${tabKey}" class="text-xs text-[#dc2626] h-8 mb-2">${attempts>0?`Code PIN incorrect. ${remaining} tentative${remaining>1?"s":""} restante${remaining>1?"s":""}.`:""}</p>
          ${btn({label:"Déverrouiller", iconName:"check", onclick:`App.tryUnlockTab('${tabKey}')`, extraCls:"w-full justify-center"})}
        </div>
      `)}
    </div>`;
}

function tryUnlockTab(tabKey){
  if(isTabLocked(tabKey)){ renderTab(); return; }
  const cfg = PIN_CONFIG[tabKey];
  const input = document.getElementById(`pin-input-${tabKey}`);
  const val = input ? input.value : "";
  if(val && val === state[cfg.pinKey]){
    unlockedTabs[tabKey] = true;
    mutate(d=>{ d.pinLocks = d.pinLocks||{}; d.pinLocks[tabKey] = { attempts:0, lockedUntil:null }; });
  } else {
    mutate(d=>{
      d.pinLocks = d.pinLocks||{};
      if(!d.pinLocks[tabKey]) d.pinLocks[tabKey] = { attempts:0, lockedUntil:null };
      d.pinLocks[tabKey].attempts += 1;
      if(d.pinLocks[tabKey].attempts >= PIN_MAX_ATTEMPTS){
        d.pinLocks[tabKey].lockedUntil = Date.now() + PIN_LOCK_DURATION_MS;
      }
    });
  }
}
function lockTab(tabKey){ unlockedTabs[tabKey] = false; renderTab(); }
function openChangePinModal(tabKey){
  const cfg = PIN_CONFIG[tabKey];
  openModal(`Modifier le code PIN — ${cfg.label}`, `
    <div class="space-y-3">
      <div>${label("Code PIN actuel")}${inputField("pin-current",{type:"password", placeholder:"••••"})}</div>
      <div>${label("Nouveau code PIN")}${inputField("pin-new",{type:"password", placeholder:"4 caractères minimum"})}</div>
      <div>${label("Confirmer le nouveau code PIN")}${inputField("pin-confirm",{type:"password"})}</div>
      <p id="pin-change-error" class="text-xs text-[#dc2626]"></p>
      ${btn({label:"Enregistrer", iconName:"check", onclick:`App.saveNewPin('${tabKey}')`, extraCls:"w-full justify-center mt-1"})}
    </div>
  `);
}
function saveNewPin(tabKey){
  const cfg = PIN_CONFIG[tabKey];
  const cur = document.getElementById("pin-current").value;
  const nw = document.getElementById("pin-new").value.trim();
  const conf = document.getElementById("pin-confirm").value.trim();
  const err = document.getElementById("pin-change-error");
  if(cur !== state[cfg.pinKey]){ err.textContent = "Code PIN actuel incorrect."; return; }
  if(!nw || nw.length<4){ err.textContent = "Le nouveau code doit contenir au moins 4 caractères."; return; }
  if(nw !== conf){ err.textContent = "La confirmation ne correspond pas."; return; }
  mutate(d=>{ d[cfg.pinKey] = nw; });
  closeModal();
}

function renderTresorerie(kind, title, iconName){
  const other = kind==="bankTransactions" ? "caisseTransactions" : "bankTransactions";
  const otherLabel = kind==="bankTransactions" ? "Caisse" : "Banque";
  const list = [...(state[kind]||[])].sort((a,b)=> a.date<b.date?1:-1);
  const solde = sumTx(state[kind]);
  const accent = kind==="bankTransactions" ? "#2563eb" : "#22c55e";
  const tabKey = kind==="bankTransactions" ? "banque" : "caisse";

  const rows = list.map(t=>`
    <tr class="border-t border-[#ffe8cc]">
      <td class="px-4 py-2.5 text-[#4b5563]">${t.date}</td>
      <td class="px-4 py-2.5">${pill(t.type==='depot'?"Dépôt":"Retrait", t.type==='depot'?"good":"bad")}</td>
      <td class="px-4 py-2.5 text-[#4b5563]">${esc(t.description)||"—"}</td>
      <td class="px-4 py-2.5 font-medium ${t.type==='depot'?"text-[#16a34a]":"text-[#dc2626]"}">${t.type==='depot'?"+":"-"}${fmt(t.amount)}</td>
      <td class="px-4 py-2.5 text-right"><button onclick="App.deleteTx('${kind}','${t.id}')" class="text-[#9ca3af] hover:text-[#dc2626] p-1">${icon("trash",14)}</button></td>
    </tr>`).join("");

  return `
    <div class="flex items-center justify-between flex-wrap gap-3 mb-5">
      ${sectionTitle(title, `Suivi des opérations de la ${title.toLowerCase()} familiale`)}
      <div class="flex gap-2 flex-wrap">
        ${btn({label:"Code PIN", iconName:"shield", onclick:`App.openChangePinModal('${tabKey}')`, variant:"outline"})}
        ${btn({label:"Verrouiller", iconName:"x", onclick:`App.lockTab('${tabKey}')`, variant:"outline"})}
        ${btn({label:`Transfert vers ${otherLabel}`, iconName:"transfer", onclick:`App.openTransferModal('${kind}','${title}','${otherLabel}')`, variant:"outline"})}
        ${btn({label:"Opération", iconName:"plus", onclick:`App.openTxModal('${kind}','${title}')`})}
      </div>
    </div>
    <div class="mb-5">${statCard(iconName, `Solde ${title.toLowerCase()}`, fmt(solde), accent)}</div>
    ${card(`<div class="overflow-x-auto"><table class="w-full text-sm">
      <thead><tr class="bg-[#fff7ed] text-[#4b5563] text-xs uppercase tracking-wide">
        <th class="text-left px-4 py-3 font-medium">Date</th>
        <th class="text-left px-4 py-3 font-medium">Type</th>
        <th class="text-left px-4 py-3 font-medium">Description</th>
        <th class="text-left px-4 py-3 font-medium">Montant</th>
        <th class="px-4 py-3"></th>
      </tr></thead>
      <tbody>${rows || `<tr><td colspan="5" class="text-center py-8 text-[#9ca3af] text-sm">Aucune opération enregistrée.</td></tr>`}</tbody>
    </table></div>`)}
  `;
}

function openTxModal(kind, title){
  openModal(`Nouvelle opération — ${title}`, `
    <div class="space-y-3">
      <div>${label("Type")}${selectField("tx-type",[{value:"depot",label:"Dépôt"},{value:"retrait",label:"Retrait"}],"depot")}</div>
      <div>${label("Montant (FCFA)")}${inputField("tx-amount",{type:"number"})}</div>
      <div>${label("Date")}${inputField("tx-date",{type:"date", value:todayISO()})}</div>
      <div>${label("Description")}${inputField("tx-desc",{placeholder:"Ex : cotisations d'août"})}</div>
      ${btn({label:"Enregistrer", iconName:"check", onclick:`App.saveTx('${kind}')`, extraCls:"w-full justify-center mt-1"})}
    </div>
  `);
}
function saveTx(kind){
  const amount = Number(document.getElementById("tx-amount").value);
  if(!amount) return;
  const type = document.getElementById("tx-type").value;
  const date = document.getElementById("tx-date").value || todayISO();
  const description = document.getElementById("tx-desc").value.trim();
  mutate(d=>{ d[kind].push({id:uid("tx"), type, amount, date, description}); });
  closeModal();
}
function deleteTx(kind,id){
  if(!confirm("Supprimer cette opération ?")) return;
  mutate(d=>{ d[kind] = d[kind].filter(t=>t.id!==id); });
}
function openTransferModal(kind, fromLabel, toLabel){
  openModal(`Transfert ${fromLabel} → ${toLabel}`, `
    <div class="space-y-3">
      <div class="flex items-center gap-2 text-sm text-[#4b5563] bg-[#fffaf5] rounded-lg px-3 py-2">
        ${icon("alert",14,"text-[#ea580c] shrink-0")} Ce transfert crée un retrait en ${fromLabel} et un dépôt en ${toLabel}.
      </div>
      <div>${label("Montant (FCFA)")}${inputField("tr-amount",{type:"number"})}</div>
      <div>${label("Date")}${inputField("tr-date",{type:"date", value:todayISO()})}</div>
      <div>${label("Description (optionnel)")}${inputField("tr-desc",{})}</div>
      ${btn({label:"Confirmer le transfert", iconName:"transfer", onclick:`App.saveTransfer('${kind}','${fromLabel}','${toLabel}')`, extraCls:"w-full justify-center mt-1"})}
    </div>
  `);
}
function saveTransfer(kind, fromLabel, toLabel){
  const amount = Number(document.getElementById("tr-amount").value);
  if(!amount) return;
  const date = document.getElementById("tr-date").value || todayISO();
  const description = document.getElementById("tr-desc").value.trim();
  const other = kind==="bankTransactions" ? "caisseTransactions" : "bankTransactions";
  mutate(d=>{
    d[kind].push({id:uid("tx"), date, type:"retrait", amount, description: description || `Transfert vers ${toLabel}`});
    d[other].push({id:uid("tx"), date, type:"depot", amount, description: description || `Transfert depuis ${fromLabel}`});
  });
  closeModal();
}

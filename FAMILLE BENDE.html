function monthsSince2025(){
  const now = new Date(); const arr=[];
  for(let y=2025;y<=now.getFullYear();y++){
    const maxM = y===now.getFullYear() ? now.getMonth() : 11;
    for(let m=0;m<=maxM;m++) arr.push({year:y,month:m});
  }
  return arr;
}

function getContribution(ev, familyId){
  const fam = state.families.find(f=>f.id===familyId);
  const c = (ev && ev.contributions && ev.contributions[familyId]) || {};
  return {
    montantPrevu: c.montantPrevu!=null ? Number(c.montantPrevu) : (fam ? Number(fam.montantDeces)||0 : 0),
    montantPaye: Number(c.montantPaye)||0,

  };
}

  const paid = c.montantPrevu>0 && c.montantPaye>=c.montantPrevu;

function avatar(url, size=44){

}

let photoDraft = {};
function photoPicker(id, currentUrl){
  return `<div class="flex items-center gap-3">
    <div id="${id}-preview">${avatar(currentUrl, 64)}</div>
    <div class="flex flex-col gap-1.5">
      <label class="text-xs font-medium text-[#a85c32] cursor-pointer underline">Choisir une photo
        <input type="file" accept="image/*" class="hidden" onchange="App.onPhotoPicked(event,'${id}')" />
      </label>
      <button type="button" onclick="App.clearPhotoPicked('${id}')" class="text-xs text-[#c23b2c] underline text-left">Retirer la photo</button>
    </div>
  </div>`;
}
function uploadingPlaceholder(size=64){
  return `<div style="width:${size}px;height:${size}px" class="rounded-full flex items-center justify-center bg-[#f1e7d6] text-[#a08a6d] border border-[#e7dcc8]">
    <svg class="spin" width="${Math.round(size*0.35)}" height="${Math.round(size*0.35)}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10" stroke-opacity="0.3"/><path d="M12 2a10 10 0 0 1 10 10"/></svg>
  </div>`;
}
function onPhotoPicked(event, id){
  const file = event.target.files[0];
  if(!file) return;
  const prev = document.getElementById(id+"-preview");
  if(prev) prev.innerHTML = uploadingPlaceholder(64);
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = ()=>{
      const size = 240;
      const canvas = document.createElement("canvas");
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext("2d");
      const scale = Math.max(size/img.width, size/img.height);
      const w = img.width*scale, h = img.height*scale;
      ctx.drawImage(img, (size-w)/2, (size-h)/2, w, h);
      canvas.toBlob(async (blob)=>{
        try{
          const path = `photos/${id}_${Date.now()}.jpg`;
          const storageRef = storage.ref().child(path);
          await storageRef.put(blob, { contentType: "image/jpeg" });
          const url = await storageRef.getDownloadURL();
          photoDraft[id] = url;
          const prev2 = document.getElementById(id+"-preview");
          if(prev2) prev2.innerHTML = avatar(url, 64);
        }catch(err){
          console.error("Erreur d'envoi vers Firebase Storage :", err);
          const prev2 = document.getElementById(id+"-preview");
          if(prev2) prev2.innerHTML = avatar(photoDraft[id]||"", 64);
          alert("Échec de l'envoi de la photo. Vérifiez la configuration de Firebase Storage (bucket + règles).");
        }
      }, "image/jpeg", 0.75);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function clearPhotoPicked(id){
  const oldUrl = photoDraft[id];
  photoDraft[id] = "";
  const prev = document.getElementById(id+"-preview");
  if(prev) prev.innerHTML = avatar("", 64);
  if(oldUrl && oldUrl.includes("firebasestorage")){
    try{ storage.refFromURL(oldUrl).delete().catch(()=>{}); }catch(e){}
  }
}

// Toutes les données de la famille sont stockées dans un seul document Firestore.
const familyDocRef = db.collection("familleBende").doc("data");

async function loadData(){
  try{
    const snap = await familyDocRef.get();
    if(snap.exists && snap.data() && snap.data().json){
      state = JSON.parse(snap.data().json);
      if(!state.genealogie) state.genealogie = structuredClone(defaultData.genealogie);
      if(!state.honneurPayments) state.honneurPayments = [];
      return;
    }
  }catch(e){ console.error("Erreur de chargement Firebase :", e); }
  state = structuredClone(defaultData);
  try{
    await familyDocRef.set({ json: JSON.stringify(state), updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
  }catch(e){ console.error("Erreur d'initialisation Firebase :", e); }
}

function scheduleSave(){
  saveIndicator = "saving";
  updateSaveIndicator();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      await familyDocRef.set({ json: JSON.stringify(state), updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
      saveIndicator="saved";
    }
    catch(e){ console.error("Erreur d'enregistrement Firebase :", e); saveIndicator="idle"; }
    updateSaveIndicator();
  }, 400);
}
function updateSaveIndicator(){
  const el = document.getElementById("save-indicator");
  if(!el) return;
  el.innerHTML = saveIndicator==="saving"
    ? `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="spin"><circle cx="12" cy="12" r="10" stroke-opacity="0.3"/><path d="M12 2a10 10 0 0 1 10 10"/></svg> Enregistrement…`
    : `${icon("shield",12)} Données partagées, synchronisées`;
}

function mutate(fn){
  fn(state);
  scheduleSave();
  renderTab();
}

function renderDashboard(){
  const months = monthsSince2025();
  const currentYear = new Date().getFullYear();
  const totalMembers = state.members.length;
  const totalActive = state.members.filter(m=>m.status!=='decede').length;
  const soldeBanque = sumTx(state.bankTransactions);
  const soldeCaisse = sumTx(state.caisseTransactions);

  const chartData = MONTH_NAMES.map((lbl,mIdx)=>{
    if(!months.find(mo=>mo.year===currentYear && mo.month===mIdx)) return {mois:lbl.slice(0,3), du:0, percu:0};
    let du=0; state.families.forEach(f=>{ du += cotisantsCount(f.id) * state.tariffMensuel; });
    const percu = state.monthlyPayments.filter(p=>p.year===currentYear && p.month===mIdx).reduce((s,p)=>s+Number(p.amount),0);
    return {mois:lbl.slice(0,3), du, percu};
  });
  const totalDuAnnee = chartData.reduce((s,c)=>s+c.du,0);
  const totalPercuAnnee = chartData.reduce((s,c)=>s+c.percu,0);
  const maxVal = Math.max(1, ...chartData.map(c=>Math.max(c.du,c.percu)));

  const decesEnCours = state.deathEvents.filter(ev=>{
    return state.families.some(f=>!contribStatus(getContribution(ev,f.id)).paid);
  });

  const barsHtml = chartData.map(c=>{
    const hDu = Math.round((c.du/maxVal)*140);
    const hPercu = Math.round((c.percu/maxVal)*140);
    return `<div class="flex flex-col items-center gap-1 flex-1 min-w-[28px]">
      <div class="flex items-end gap-0.5 h-[140px]">
        <div class="w-3 sm:w-4 rounded-t bg-[#e7dcc8]" style="height:${hDu}px" title="Dû : ${fmt(c.du)}"></div>
        <div class="w-3 sm:w-4 rounded-t bg-[#a85c32]" style="height:${hPercu}px" title="Perçu : ${fmt(c.percu)}"></div>
      </div>
      <span class="text-[10px] text-[#8a7a63]">${c.mois}</span>
    </div>`;
  }).join("");

  return `
    ${sectionTitle("Tableau de bord","Vue d'ensemble de l'association familiale")}
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
      ${statCard("users","Familles", state.families.length, "#c1631a", `${totalMembers} membres, dont ${totalActive} actifs`)}
      ${statCard("wallet","Solde caisse", fmt(soldeCaisse), "#2f8f5b")}
      ${statCard("landmark","Solde banque", fmt(soldeBanque), "#2f6fb8")}
      ${statCard("heart","Décès en cours", decesEnCours.length, "#c22f3d", decesEnCours.length? "cotisation(s) non soldée(s)":"aucune en attente")}
    </div>

    ${card(`
      <div class="p-5">
        <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
          <div>
            <h3 class="font-semibold text-[#2e1b12] font-display">Cotisation mensuelle ${currentYear}</h3>
            <p class="text-xs text-[#8a7a63] mt-0.5">Dû ${fmt(totalDuAnnee)} · Perçu ${fmt(totalPercuAnnee)} · Reste ${fmt(Math.max(totalDuAnnee-totalPercuAnnee,0))}</p>
          </div>
          <div class="flex items-center gap-3 text-xs text-[#6b5a41]">
            <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-sm bg-[#e7dcc8] inline-block"></span> Dû</span>
            <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-sm bg-[#a85c32] inline-block"></span> Perçu</span>
          </div>
        </div>
        <div class="flex items-end gap-1 sm:gap-2 overflow-x-auto pb-1">${barsHtml}</div>
      </div>
    `, "mb-6")}

    ${card(`
      <div class="p-5">
        <h3 class="font-semibold text-[#2e1b12] mb-3 font-display">Répartition par branche familiale</h3>
        <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
          ${state.families.map(f=>`
            <div class="border border-[#eee1cb] rounded-xl p-3.5">
              <p class="font-medium text-[#2e1b12] text-sm">${esc(f.name)}</p>
              <p class="text-xs text-[#8a7a63] mt-0.5">${activeCount(f.id)} membre(s) actif(s)</p>
              <p class="text-xs text-[#a08a6d] mt-1">Cotisation décès fixée : ${fmt(f.montantDeces)}</p>
            </div>`).join("")}
        </div>
      </div>
    `)}
  `;
}

function saveNewFamily(){

  if(!name) return;

function saveFamilyEdit(id){
  const name = document.getElementById("ef-name").value.trim();
  const chef = document.getElementById("ef-chef").value.trim();
  const delegue = document.getElementById("ef-delegue").value.trim();
  const contact = document.getElementById("ef-contact").value.trim();

function deleteFamily(id){
  if(memberCount(id)>0){
    if(!confirm("Cette famille contient des membres. Les supprimer aussi et retirer la famille ?")) return;
  } else if(!confirm("Supprimer cette famille ?")) return;
  mutate(d=>{ d.families=d.families.filter(f=>f.id!==id); d.members=d.members.filter(m=>m.familyId!==id); });
}

function genPersonByPath(path){
  if(path==="pere") return state.genealogie.pere;
  if(path==="mere") return state.genealogie.mere;
  const parts = path.split(":");
  if(parts[0]==="enfant") return state.genealogie.enfants.find(e=>e.id===parts[1]);
  if(parts[0]==="petitenfant"){
    const parent = state.genealogie.enfants.find(e=>e.id===parts[1]);
    return parent && parent.enfants ? parent.enfants.find(c=>c.id===parts[2]) : null;
  }
  return null;
}

function toggleAscendantDeathField(){
  const status = document.getElementById("am-status").value;
  document.getElementById("am-death-wrap").classList.toggle("hidden", status!=="decede");
}
function saveAscendantMember(memberId){
  const dateNaissance = document.getElementById("am-birth").value || "";
  const status = document.getElementById("am-status").value;
  const dateDeces = status==="decede" ? (document.getElementById("am-death").value || "") : "";
  const photo = photoDraft["am-photo"] || "";
  delete photoDraft["am-photo"];
  mutate(d=>{ const mem=d.members.find(x=>x.id===memberId); if(mem) Object.assign(mem,{dateNaissance,status,dateDeces,photo}); });
  closeModal();
}

function renderAscendants(){
  const g = state.genealogie;
  const childrenHtml = g.enfants.map(enf=>{
    const family = state.families.find(f=>f.name===enf.name);
    const familyMembers = family ? state.members.filter(m=>m.familyId===family.id) : [];
    let descendantsHtml;
    if(familyMembers.length){
      descendantsHtml = `<div class="flex flex-col items-center shrink-0"><div class="w-px h-4 bg-[#d9c7a3]"></div>${familyMembersBox(familyMembers)}</div>`;
    } else {
      descendantsHtml = (enf.enfants||[]).map(pe=>`
        <div class="flex flex-col items-center shrink-0">
          <div class="w-px h-4 bg-[#d9c7a3]"></div>
          ${genNode(pe, `petitenfant:${enf.id}:${pe.id}`)}
        </div>
      `).join("");
    }
    return `<div class="flex flex-col items-center shrink-0">
      ${genNode(enf, `enfant:${enf.id}`)}
      ${descendantsHtml}
    </div>`;
  }).join("");

  return `
    ${sectionTitle("Ascendants","Arbre généalogique — parents fondateurs, leurs enfants et descendants")}
    <div class="overflow-x-auto pb-2">
      <div class="flex flex-col items-center min-w-max px-2">
        <div class="flex items-center gap-3">

function renderCotisation(){
  const now = new Date();
  if(!cotisationSel) cotisationSel = { year: now.getFullYear(), month: now.getMonth() };

  const monthOptions = MONTH_NAMES.map((nom,idx)=>({value:String(idx), label:nom}));
  const yearOptions = [];
  for(let y=2016; y<=2070; y++) yearOptions.push({value:String(y), label:String(y)});

  const periodSelector = `
    <div class="flex items-center gap-2 flex-wrap">
      ${selectField("cot-month", monthOptions, String(cotisationSel.month), "min-w-[150px]", "App.setCotisationSel()")}
      ${selectField("cot-year", yearOptions, String(cotisationSel.year), "min-w-[110px]", "App.setCotisationSel()")}
    </div>`;

  const rows = state.families.map(f=>{
    const nb = cotisantsCount(f.id);
    const due = nb * state.tariffMensuel;
    const paid = state.monthlyPayments.filter(p=>p.familyId===f.id && p.year===cotisationSel.year && p.month===cotisationSel.month).reduce((s,p)=>s+Number(p.amount),0);
    const reste = Math.max(due-paid,0);
    const tone = (paid>=due && due>0) ? "good" : (paid>0 ? "warn" : "bad");
    const label_ = (paid>=due && due>0) ? "Payé" : (paid>0 ? "Partiel" : "Impayé");
    return `<tr class="border-t border-[#f1e7d6]">
      <td class="px-4 py-2.5 font-medium text-[#2e1b12]">${esc(f.name)}</td>
      <td class="px-4 py-2.5 text-[#6b5a41]">${nb}</td>
      <td class="px-4 py-2.5 text-[#6b5a41]">${fmt(due)}</td>
      <td class="px-4 py-2.5 text-[#6b5a41]">${fmt(paid)}</td>
      <td class="px-4 py-2.5 text-[#6b5a41]">${fmt(reste)}</td>
      <td class="px-4 py-2.5">${pill(label_,tone)}</td>
      <td class="px-4 py-2.5 text-right">${btn({label:"Paiement", iconName:"plus", onclick:`App.openPaymentModal('${f.id}')`, variant:"outline"})}</td>
    </tr>`;
  }).join("");

  return `
    <div class="flex items-center justify-between flex-wrap gap-3 mb-5">
      ${sectionTitle("Cotisation mensuelle","Cotisation due par membre, payée au nom de chaque famille")}
      <div id="tariff-box">${tariffBoxHtml()}</div>
    </div>
    <div class="mb-4">
      ${label("Période")}
      <div class="mt-1">${periodSelector}</div>
    </div>
    ${card(`<div class="overflow-x-auto"><table class="w-full text-sm">
      <thead><tr class="bg-[#f6efe0] text-[#6b5a41] text-xs uppercase tracking-wide">
        <th class="text-left px-4 py-3 font-medium">Famille</th>
        <th class="text-left px-4 py-3 font-medium">Cotisants</th>
        <th class="text-left px-4 py-3 font-medium">Montant dû</th>
        <th class="text-left px-4 py-3 font-medium">Perçu</th>
        <th class="text-left px-4 py-3 font-medium">Reste</th>
        <th class="text-left px-4 py-3 font-medium">Statut</th>
        <th class="px-4 py-3"></th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`, "mb-5")}
    ${honneurCardHtml()}
  `;
}

    const due = Number(m.montantHonneur)||50000;
    const paid = (state.honneurPayments||[]).filter(p=>p.memberId===m.id && p.year===currentYear).reduce((s,p)=>s+Number(p.amount),0);
    const reste = Math.max(due-paid,0);
    const tone = (paid>=due && due>0) ? "good" : (paid>0 ? "warn" : "bad");
    const label_ = (paid>=due && due>0) ? "Payé" : (paid>0 ? "Partiel" : "Impayé");
    return `<tr class="border-t border-[#f1e7d6]">
      <td class="px-4 py-2.5 font-medium text-[#2e1b12]">${esc(m.name)}${telLink(m.contact)?` ${telLink(m.contact)}`:""}</td>
      <td class="px-4 py-2.5 text-[#6b5a41]">${esc(famName(m.familyId))}</td>

      <td class="px-4 py-2.5">${pill(label_,tone)}</td>
      <td class="px-4 py-2.5 text-right">${btn({label:"Paiement", iconName:"plus", onclick:`App.openHonneurPaymentModal('${m.id}')`, variant:"outline"})}</td>

  }).join("");
  return card(`<div class="p-5">
    <h3 class="font-semibold text-[#2e1b12] mb-1 font-display">Membres d'honneur</h3>
    <p class="text-xs text-[#8a7a63] mb-4">Cotisation annuelle forfaitaire (hors décompte mensuel des familles) — année ${currentYear}</p>

        <th class="text-left px-4 py-3 font-medium">Famille</th>

        <th class="text-left px-4 py-3 font-medium">Perçu</th>
        <th class="text-left px-4 py-3 font-medium">Reste</th>
        <th class="text-left px-4 py-3 font-medium">Statut</th>
        <th class="px-4 py-3"></th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>`);

function openHonneurPaymentModal(memberId){

  const existing = (state.honneurPayments||[]).filter(p=>p.memberId===memberId && p.year===currentYear);

    ${existing.length? `<div class="mt-5 pt-4 border-t border-[#eee1cb]">
      <p class="text-xs font-medium text-[#8a7a63] mb-2">Paiements déjà enregistrés (${currentYear})</p>

      </div>

function saveHonneurPayment(memberId){
  const due = Number(document.getElementById("hp-due").value)||50000;
  const amount = Number(document.getElementById("hp-amount").value);
  const date = document.getElementById("hp-date").value || todayISO();
  const note = document.getElementById("hp-note").value.trim();
  const year = cotisationSel ? cotisationSel.year : new Date().getFullYear();
  mutate(d=>{
    const mem = d.members.find(x=>x.id===memberId);
    if(mem) mem.montantHonneur = due;
    if(amount){ d.honneurPayments = d.honneurPayments||[]; d.honneurPayments.push({id:uid("hpay"), memberId, year, amount, date, note}); }
  });
  openHonneurPaymentModal(memberId);
}

/* ======================================================================= */
/*  Onglet : Cotisation décès                                               */
/* ======================================================================= */

function renderDeces(){
  if(state.deathEvents.length===0){
    return `
      <div class="flex items-center justify-between flex-wrap gap-3 mb-5">
        ${sectionTitle("Cotisation décès","En cas de décès d'un parent : une cotisation exceptionnelle, un montant fixé par famille")}
        ${btn({label:"Déclarer un décès", iconName:"plus", onclick:"App.openNewDeathModal()"})}
      </div>
      ${card(`<div class="p-8 text-center">${icon("heart",28,"mx-auto text-[#c9b393] mb-2")}<p class="text-sm text-[#8a7a63]">Aucune cotisation décès enregistrée pour le moment.</p></div>`)}
    `;
  }
  if(!decesSelectedEvent || !state.deathEvents.find(e=>e.id===decesSelectedEvent)) decesSelectedEvent = state.deathEvents[0].id;
  const ev = state.deathEvents.find(e=>e.id===decesSelectedEvent);

  const chips = state.deathEvents.map(e=>`
    <button onclick="App.selectDeathEvent('${e.id}')" class="shrink-0 px-3.5 py-2 rounded-lg text-sm font-medium border ${decesSelectedEvent===e.id?"bg-[#a83c32] text-white border-[#a83c32]":"bg-white border-[#e7dcc8] text-[#6b5a41] hover:bg-[#f6efe0]"}">${esc(e.label)} · ${e.date}</button>
  `).join("");

  const totalAttendu = state.families.reduce((s,f)=>s+getContribution(ev,f.id).montantPrevu,0);
  const totalCollecte = state.families.reduce((s,f)=>s+getContribution(ev,f.id).montantPaye,0);

  const familiesHtml = state.families.map(f=>{
    const c = getContribution(ev, f.id);
    const st = contribStatus(c);
    const reste = Math.max(c.montantPrevu - c.montantPaye, 0);
    return `<div class="border border-[#eee1cb] rounded-xl p-3 flex items-center justify-between gap-3 flex-wrap">
      <div class="min-w-0">
        <p class="font-medium text-sm text-[#2e1b12]">${esc(f.name)}</p>
        <p class="text-xs text-[#8a7a63]">Prévu : ${fmt(c.montantPrevu)} &nbsp;·&nbsp; Payé : ${fmt(c.montantPaye)}${reste>0?` &nbsp;·&nbsp; Reste : ${fmt(reste)}`:""}</p>
        ${c.montantPaye>0 && c.date ? `<p class="text-xs text-[#1f7a43] mt-0.5">Dernier versement le ${fmtDate(c.date)}</p>` : ""}
      </div>
      <div class="flex items-center gap-2 shrink-0">
        ${pill(st.label, st.tone)}
        <button onclick="App.openDeathContribModal('${f.id}')" class="text-[#8a7a63] hover:text-[#a85c32] p-1.5 rounded-lg hover:bg-[#faf5ea]">${icon("pencil",14)}</button>
      </div>
    </div>`;
  }).join("");

  return `
    <div class="flex items-center justify-between flex-wrap gap-3 mb-5">
      ${sectionTitle("Cotisation décès","En cas de décès d'un parent : une cotisation exceptionnelle, un montant fixé par famille")}
      ${btn({label:"Déclarer un décès", iconName:"plus", onclick:"App.openNewDeathModal()"})}
    </div>
    <div class="flex gap-2 overflow-x-auto pb-1 mb-4">${chips}</div>
    <div class="grid lg:grid-cols-2 gap-5">
      ${card(`
        <div class="p-4">
          <div class="flex items-center justify-between mb-3">
            <h3 class="font-semibold text-[#2e1b12] font-display">Familles</h3>
            <button onclick="App.deleteDeathEvent('${ev.id}')" class="text-[#a08a6d] hover:text-[#a83c32]">${icon("trash",15)}</button>
          </div>
          <div class="space-y-2.5">${familiesHtml}</div>
          <div class="mt-3 pt-3 border-t border-[#eee1cb] flex justify-between text-sm">
            <span class="text-[#8a7a63]">Total attendu</span><span class="font-semibold text-[#2e1b12]">${fmt(totalAttendu)}</span>
          </div>
          <div class="flex justify-between text-sm">
            <span class="text-[#8a7a63]">Total collecté</span><span class="font-semibold text-[#3f6b45]">${fmt(totalCollecte)}</span>
          </div>
        </div>
      `)}
      ${card(`
        <div class="p-4">
          <h3 class="font-semibold text-[#2e1b12] mb-3 font-display">Membres &amp; contacts</h3>
          <div class="relative mb-3">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-[#b3a284]">${icon("search",14)}</span>
            ${inputField("deces-search",{value:decesSearch, placeholder:"Rechercher un membre…", extraCls:"pl-8", oninput:"App.setDecesSearch(this.value)"})}
          </div>
          <div id="deces-members-list" class="max-h-[420px] overflow-y-auto space-y-1.5 pr-1">${decesMembersListHtml()}</div>
        </div>
      `)}
    </div>
  `;
}
function decesMembersListHtml(){
  const list = state.members.filter(m=>m.name.toLowerCase().includes(decesSearch.toLowerCase()));
  return list.map(m=>`
    <div class="flex items-center justify-between text-sm px-2.5 py-2 rounded-lg hover:bg-[#faf5ea]">
      <div class="min-w-0">
        <p class="font-medium truncate ${m.status==='decede'?"text-[#6d3fa0]":"text-[#2e1b12]"}">${esc(m.name)}</p>
        <p class="text-xs text-[#a08a6d]">${esc(famName(m.familyId))}${m.status==='decede' && m.dateDeces? ` · Décédé(e) le ${fmtDate(m.dateDeces)}`:""}</p>
      </div>
      <div class="text-right shrink-0 ml-2"><p class="text-xs text-[#6b5a41] flex items-center gap-1.5 justify-end">${esc(m.contact)||"—"}${telLink(m.contact,11)}</p>${m.status==='decede'?pill("Décédé(e)","violet"):""}</div>
    </div>`).join("") || `<p class="text-sm text-[#a08a6d] text-center py-6">Aucun résultat.</p>`;
}
function setDecesSearch(v){ decesSearch=v; document.getElementById("deces-members-list").innerHTML = decesMembersListHtml(); }
function selectDeathEvent(id){ decesSelectedEvent=id; renderTab(); }
function openDeathContribModal(familyId){
  const fam = state.families.find(f=>f.id===familyId);
  const ev = state.deathEvents.find(e=>e.id===decesSelectedEvent);
  const c = getContribution(ev, familyId);
  openModal(`Cotisation décès — ${esc(fam.name)}`, `
    <p class="text-xs text-[#8a7a63] mb-3">${esc(ev.label)} · ${ev.date}</p>
    <div class="space-y-3">
      <div>${label("Montant prévu (FCFA)")}${inputField("dc-prevu",{type:"number", value:c.montantPrevu})}</div>
      <div>${label("Montant payé (FCFA)")}${inputField("dc-paye",{type:"number", value:c.montantPaye})}</div>
      <div>${label("Date du versement")}${inputField("dc-date",{type:"date", value:c.date||todayISO()})}</div>
      ${btn({label:"Enregistrer", iconName:"check", onclick:`App.saveDeathContribution('${familyId}')`, extraCls:"w-full justify-center mt-1"})}
    </div>
  `);
}
function saveDeathContribution(familyId){
  const montantPrevu = Number(document.getElementById("dc-prevu").value)||0;
  const montantPaye = Number(document.getElementById("dc-paye").value)||0;
  const date = document.getElementById("dc-date").value || todayISO();
  mutate(d=>{
    const target = d.deathEvents.find(e=>e.id===decesSelectedEvent);
    target.contributions[familyId] = { montantPrevu, montantPaye, date };
  });
  closeModal();
}
function deleteDeathEvent(id){
  if(!confirm("Supprimer cette cotisation décès ?")) return;
  mutate(d=>{ d.deathEvents = d.deathEvents.filter(e=>e.id!==id); });
  decesSelectedEvent = null;
}
function openNewDeathModal(){
  openModal("Déclarer un décès", `
    <div class="space-y-3">
      <div>${label("Nom du parent décédé")}${inputField("nd-label",{placeholder:"Ex : Bèndè André"})}</div>
      <div>${label("Date du décès")}${inputField("nd-date",{type:"date", value:todayISO()})}</div>
      ${btn({label:"Créer la cotisation", iconName:"check", onclick:"App.saveNewDeathEvent()", extraCls:"w-full justify-center mt-1"})}
    </div>
  `);
}
function saveNewDeathEvent(){
  const label_ = document.getElementById("nd-label").value.trim();
  if(!label_) return;
  const date = document.getElementById("nd-date").value || todayISO();
  const id = uid("dc");
  mutate(d=>{ d.deathEvents.unshift({id, label:label_, date, contributions:{}}); });
  decesSelectedEvent = id;
  closeModal();
  renderTab();
}

/* ======================================================================= */
/*  Onglets Banque / Caisse                                                 */
/* ======================================================================= */

function renderTresorerie(kind, title, iconName){
  const other = kind==="bankTransactions" ? "caisseTransactions" : "bankTransactions";
  const otherLabel = kind==="bankTransactions" ? "Caisse" : "Banque";
  const list = [...(state[kind]||[])].sort((a,b)=> a.date<b.date?1:-1);
  const solde = sumTx(state[kind]);
  const accent = kind==="bankTransactions" ? "#2f6fb8" : "#2f8f5b";

  const rows = list.map(t=>`
    <tr class="border-t border-[#f1e7d6]">
      <td class="px-4 py-2.5 text-[#6b5a41]">${t.date}</td>
      <td class="px-4 py-2.5">${pill(t.type==='depot'?"Dépôt":"Retrait", t.type==='depot'?"good":"bad")}</td>
      <td class="px-4 py-2.5 text-[#6b5a41]">${esc(t.description)||"—"}</td>
      <td class="px-4 py-2.5 font-medium ${t.type==='depot'?"text-[#3f6b45]":"text-[#a83c32]"}">${t.type==='depot'?"+":"-"}${fmt(t.amount)}</td>
      <td class="px-4 py-2.5 text-right"><button onclick="App.deleteTx('${kind}','${t.id}')" class="text-[#a08a6d] hover:text-[#a83c32] p-1">${icon("trash",14)}</button></td>
    </tr>`).join("");

  return `
    <div class="flex items-center justify-between flex-wrap gap-3 mb-5">
      ${sectionTitle(title, `Suivi des opérations de la ${title.toLowerCase()} familiale`)}
      <div class="flex gap-2">
        ${btn({label:`Transfert vers ${otherLabel}`, iconName:"transfer", onclick:`App.openTransferModal('${kind}','${title}','${otherLabel}')`, variant:"outline"})}
        ${btn({label:"Opération", iconName:"plus", onclick:`App.openTxModal('${kind}','${title}')`})}
      </div>
    </div>
    <div class="mb-5">${statCard(iconName, `Solde ${title.toLowerCase()}`, fmt(solde), accent)}</div>
    ${card(`<div class="overflow-x-auto"><table class="w-full text-sm">
      <thead><tr class="bg-[#f6efe0] text-[#6b5a41] text-xs uppercase tracking-wide">
        <th class="text-left px-4 py-3 font-medium">Date</th>
        <th class="text-left px-4 py-3 font-medium">Type</th>
        <th class="text-left px-4 py-3 font-medium">Description</th>
        <th class="text-left px-4 py-3 font-medium">Montant</th>
        <th class="px-4 py-3"></th>
      </tr></thead>
      <tbody>${rows || `<tr><td colspan="5" class="text-center py-8 text-[#a08a6d] text-sm">Aucune opération enregistrée.</td></tr>`}</tbody>
    </table></div>`)}
  `;
}

function openTxModal(kind, title){
  openModal(`Nouvelle opération — ${title}`, `
    <div class="space-y-3">
      <div>${label("Type")}${selectField("tx-type",[{value:"depot",label:"Dépôt"},{value:"retrait",label:"Retrait"}],"depot")}</div>
      <div>${label("Montant (FCFA)")}${inputField("tx-amount",{type:"number"})}</div>
      <div>${label("Date")}${inputField("tx-date",{type:"date", value:todayISO()})}</div>
      <div>${label("Description")}${inputField("tx-desc",{placeholder:"Ex : cotisations d'août"})}</div>
      ${btn({label:"Enregistrer", iconName:"check", onclick:`App.saveTx('${kind}')`, extraCls:"w-full justify-center mt-1"})}
    </div>
  `);
}
function saveTx(kind){
  const amount = Number(document.getElementById("tx-amount").value);
  if(!amount) return;
  const type = document.getElementById("tx-type").value;
  const date = document.getElementById("tx-date").value || todayISO();
  const description = document.getElementById("tx-desc").value.trim();
  mutate(d=>{ d[kind].push({id:uid("tx"), type, amount, date, description}); });
  closeModal();
}
function deleteTx(kind,id){
  if(!confirm("Supprimer cette opération ?")) return;
  mutate(d=>{ d[kind] = d[kind].filter(t=>t.id!==id); });
}
function openTransferModal(kind, fromLabel, toLabel){
  openModal(`Transfert ${fromLabel} → ${toLabel}`, `
    <div class="space-y-3">
      <div class="flex items-center gap-2 text-sm text-[#6b5a41] bg-[#faf5ea] rounded-lg px-3 py-2">
        ${icon("alert",14,"text-[#a85c32] shrink-0")} Ce transfert crée un retrait en ${fromLabel} et un dépôt en ${toLabel}.
      </div>
      <div>${label("Montant (FCFA)")}${inputField("tr-amount",{type:"number"})}</div>
      <div>${label("Date")}${inputField("tr-date",{type:"date", value:todayISO()})}</div>
      <div>${label("Description (optionnel)")}${inputField("tr-desc",{})}</div>
      ${btn({label:"Confirmer le transfert", iconName:"transfer", onclick:`App.saveTransfer('${kind}','${fromLabel}','${toLabel}')`, extraCls:"w-full justify-center mt-1"})}
    </div>
  `);
}
function saveTransfer(kind, fromLabel, toLabel){
  const amount = Number(document.getElementById("tr-amount").value);
  if(!amount) return;
  const date = document.getElementById("tr-date").value || todayISO();
  const description = document.getElementById("tr-desc").value.trim();
  const other = kind==="bankTransactions" ? "caisseTransactions" : "bankTransactions";
  mutate(d=>{
    d[kind].push({id:uid("tx"), date, type:"retrait", amount, description: description || `Transfert vers ${toLabel}`});
    d[other].push({id:uid("tx"), date, type:"depot", amount, description: description || `Transfert depuis ${fromLabel}`});
  });
  closeModal();
}

/* ======================================================================= */
/*  API publique (attachée à window.App pour les onclick inline)            */
/* ======================================================================= */

window.App = {
  setTab(id){ currentTab=id; renderShell(); },
  closeModal, openNewFamilyModal, saveNewFamily, editFamily, cancelFamilyEdit, saveFamilyEdit, deleteFamily,
  openGenealogieEditModal, saveGenealogieEdit, openAscendantMemberModal, toggleAscendantDeathField, saveAscendantMember,
  onPhotoPicked, clearPhotoPicked,
  setMembresSearch, setMembresFilter, editMember, cancelMemberEdit, saveMemberEdit, deleteMember, openNewMemberModal, saveNewMember,
  setCotisationSel, startTariffEdit, cancelTariffEdit, saveTariff, openPaymentModal, savePayment,
  openHonneurPaymentModal, saveHonneurPayment, toggleHonneur,
  selectDeathEvent, openDeathContribModal, saveDeathContribution, deleteDeathEvent, openNewDeathModal, saveNewDeathEvent, setDecesSearch,
  openTxModal, saveTx, deleteTx, openTransferModal, saveTransfer
};

/* ======================================================================= */
/*  Démarrage                                                               */
/* ======================================================================= */

(async function init(){
  document.getElementById("root").innerHTML = `
    <div class="min-h-[500px] flex items-center justify-center bg-[#faf5ea]">
      <div class="flex flex-col items-center gap-3 text-[#a85c32]">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="spin"><circle cx="12" cy="12" r="10" stroke-opacity="0.3"/><path d="M12 2a10 10 0 0 1 10 10"/></svg>
        <p class="text-sm text-[#8a7a63]">Chargement des données de la famille…</p>
      </div>
    </div>`;
  await loadData();
  renderShell();
})();
</script>
